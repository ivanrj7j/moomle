[project]
name = "moomle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.7",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
